<!DOCTYPE html>
<html>
<head>
  <title>MiniRAFT Drawing Board</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { background: #fff; display: block; }
    body { margin: 0; overflow: hidden; background: #121212; }

    canvas { background: #111; display: block; }

    #statusPanel {
    position: fixed;
    top: 70px;
    left: 10px;
    background: rgba(20,20,20,0.9);
    padding: 10px;
    border-radius: 10px;
    color: white;
    font-size: 14px;
    min-width: 220px;
  }

    #toolbar {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(30,30,30,0.9);
      padding: 10px;
      border-radius: 10px;
      color: white;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at top, #1a1a2e, #0f0f1a);
  font-family: 'Inter', sans-serif;
}

/* Canvas */
canvas {
  background: transparent;
  display: block;
}

/* Toolbar */
#toolbar {
  position: fixed;
  top: 20px;
  left: 20px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 12px 16px;
  border-radius: 14px;
  display: flex;
  gap: 12px;
  align-items: center;
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

/* Status Panel */
#statusPanel {
  position: fixed;
  top: 100px;
  left: 20px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 16px;
  border-radius: 14px;
  color: white;
  min-width: 260px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

  /* Title */
  .status-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
  }

  /* Replica Row */
  .replica {
    display: flex;
    justify-content: space-between;
    padding: 6px 8px;
    border-radius: 8px;
    margin-bottom: 5px;
    transition: 0.2s;
  }

  .replica:hover {
    background: rgba(255,255,255,0.05);
  }

  /* Badges */
  .badge {
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
  }

  .leader {
    background: #4CAF50;
  }

  .follower {
    background: #555;
  }

  .candidate {
    background: #FFC107;
  }

  .down {
    background: #f44336;
  }

  .leader {
    background: #4CAF50;
    box-shadow: 0 0 10px rgba(76,175,80,0.7);
  }

  .replica {
    transition: all 0.2s ease;
  }
  </style>
</head>
<body>
<div id="toolbar">
  <input type="color" id="colorPicker">
  <input type="range" id="brushSize" min="1" max="10" value="2">
  <button id="clearBtn">Clear</button>
</div>
<canvas id="board"></canvas>
<div id="statusPanel"></div>

<script>
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");

resizeCanvas();

let drawing = false;
let lastX = 0;
let lastY = 0;

// CONFIG
let userColor = sessionStorage.getItem("color");

if (!userColor) {
  userColor = `hsl(${Math.random() * 360}, 70%, 50%)`;
  sessionStorage.setItem("color", userColor);
}

let width = 2;
let strokeBuffer = [];  // outgoing to gateway
let renderQueue = [];   // incoming from gateway, drained by rAF

// 🔌 CONNECT TO GATEWAY
const wsHost = window.location.hostname || 'localhost';
const ws = new WebSocket(`ws://${wsHost}:8080`);

ws.onopen = () => {
  console.log("Connected to gateway");
  ws.send(JSON.stringify({ type: "init_request" }));
  
};

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);

  if (msg.type === "stroke") {
    renderQueue.push(msg.payload);
  }

  if (msg.type === "stroke-batch") {
    if (Array.isArray(msg.payload)) {
      for (const s of msg.payload) renderQueue.push(s);
    }
  }

  if (msg.type === "init" || msg.type === "sync") {
    if (!msg.strokes) return;
    // Synchronous replay is fine here — full state load, not live drawing
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const entry of msg.strokes) {
      if (entry.stroke?.clear) ctx.clearRect(0, 0, canvas.width, canvas.height);
      else drawLine(entry.stroke);
    }
  }
};

ws.onclose = () => {
  console.log("WebSocket disconnected");
};

ws.onerror = (err) => {
  console.log("WebSocket error", err);
};

function rafLoop() {
  if (strokeBuffer.length > 0 && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "draw", payload: strokeBuffer }));
    strokeBuffer = [];
  }
  if (renderQueue.length > 0) {
    drawBatch(renderQueue);
    renderQueue = [];
  }
  requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);

// ✏️ DRAW FUNCTION
function drawLine({ x0, y0, x1, y1, color, width }) {
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
}

// Batch draw: groups consecutive same-style connected segments into one path,
// drastically reducing ctx.stroke() calls on Android where each call is expensive.
function drawBatch(strokes) {
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  let i = 0;
  while (i < strokes.length) {
    const s = strokes[i];
    if (!s || s.clear) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      i++;
      continue;
    }
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.width;
    ctx.beginPath();
    ctx.moveTo(s.x0, s.y0);
    ctx.lineTo(s.x1, s.y1);
    let px = s.x1, py = s.y1;
    i++;
    while (i < strokes.length && !strokes[i].clear &&
           strokes[i].color === s.color && strokes[i].width === s.width) {
      const n = strokes[i];
      if (n.x0 !== px || n.y0 !== py) { ctx.stroke(); ctx.beginPath(); ctx.moveTo(n.x0, n.y0); }
      ctx.lineTo(n.x1, n.y1);
      px = n.x1; py = n.y1;
      i++;
    }
    ctx.stroke();
  }
}

// 🖱️ MOUSE EVENTS
canvas.addEventListener("mousedown", (e) => {
  drawing = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener("mousemove", (e) => {
  if (!drawing) return;

  const x = e.clientX;
  const y = e.clientY;
  const payload = { x0: lastX, y0: lastY, x1: x, y1: y, color: userColor, width };

  drawLine(payload);          // local draw — immediate, smooth
  strokeBuffer.push(payload); // batched send every 16ms

  lastX = x;
  lastY = y;
});

canvas.addEventListener("mouseup", () => drawing = false);
canvas.addEventListener("mouseleave", () => drawing = false);

// 📱 TOUCH SUPPORT
canvas.addEventListener("touchstart", (e) => {
  const touch = e.touches[0];
  drawing = true;
  lastX = touch.clientX;
  lastY = touch.clientY;
});

canvas.addEventListener("touchmove", (e) => {
  if (!drawing) return;

  // getCoalescedEvents recovers intermediate points Android coalesces away
  const points = e.getCoalescedEvents ? e.getCoalescedEvents() : [e.touches[0]];
  for (const touch of points) {
    const x = touch.clientX;
    const y = touch.clientY;
    const payload = { x0: lastX, y0: lastY, x1: x, y1: y, color: userColor, width };
    drawLine(payload);
    strokeBuffer.push(payload);
    lastX = x;
    lastY = y;
  }
});

canvas.addEventListener("touchend", () => drawing = false);

const colorPicker = document.getElementById("colorPicker");
const brushSize = document.getElementById("brushSize");
const clearBtn = document.getElementById("clearBtn");

colorPicker.value = userColor;

colorPicker.addEventListener("input", () => {
  userColor = colorPicker.value;
  localStorage.setItem("color", userColor);
});

brushSize.addEventListener("input", () => {
  width = brushSize.value;
});

clearBtn.addEventListener("click", () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);  // clear locally immediately
  ws.send(JSON.stringify({ type: "stroke", payload: { clear: true } }));
});

canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
}, { passive: false });

const replicaHost = window.location.hostname || 'localhost';
const replicas = [
  `http://${replicaHost}:3001`,
  `http://${replicaHost}:3002`,
  `http://${replicaHost}:3003`,
];

let lastLeader = null;

async function fetchStatus() {
  const panel = document.getElementById("statusPanel");

  let html = `<div class="status-title">⚡ Cluster Status</div>`;
  let currentLeader = null;

  const results = await Promise.allSettled(
    replicas.map(url =>
      fetch(`${url}/status`, { signal: AbortSignal.timeout(500) }).then(r => r.json())
    )
  );

  results.forEach((result, i) => {
    const url = replicas[i];
    if (result.status === 'fulfilled') {
      const data = result.value;
      let roleClass = "follower";
      let label = "Follower";
      if (data.role === "leader") { roleClass = "leader"; label = "Leader 👑"; currentLeader = data.nodeId; }
      if (data.role === "candidate") { roleClass = "candidate"; label = "Candidate"; }
      html += `
        <div class="replica">
          <span>${data.nodeId}</span>
          <span class="badge ${roleClass}">${label}</span>
        </div>
      `;
    } else {
      html += `
        <div class="replica">
          <span>${url.split(":").pop()}</span>
          <span class="badge down">DOWN ❌</span>
        </div>
      `;
    }
  });

  if (currentLeader !== lastLeader) {
    html += `<div style="margin-top:10px;font-size:12px;opacity:0.7">
      Leader changed → ${currentLeader}
    </div>`;
    lastLeader = currentLeader;
  }

  panel.innerHTML = html;
}

setInterval(fetchStatus, 3000);
fetchStatus();

function resizeCanvas() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2); // cap at 2x — 3x/4x costs 4-9x canvas area for no visible gain

  const temp = document.createElement("canvas");
  temp.width = canvas.width;
  temp.height = canvas.height;
  temp.getContext("2d").drawImage(canvas, 0, 0);

  canvas.width = window.innerWidth * ratio;
  canvas.height = window.innerHeight * ratio;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

  ctx.drawImage(temp, 0, 0);
}

// 🔥 listen to resize
window.addEventListener("resize", resizeCanvas);
</script>

</body>
</html>
